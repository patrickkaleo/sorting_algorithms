services:
  all:
    image: sorting_algorithms
    pull_policy: build
    working_dir: /app
    build: 
      context: .
      dockerfile: Dockerfile
    tty: true 
    volumes:
      - .:/export
    command: ["sh", "-c", "cp -f /app/main /app/main_test /export/ && exec ./main"] 
  
  test: 
    depends_on:
      all:
        condition: service_completed_successfully
    image: sorting_algorithms
    pull_policy: build
    command: ["./main_test"]
  run: 
    depends_on:
      all:
        condition: service_completed_successfully
    image: sorting_algorithms
    pull_policy: build
    command: ["./main"]
    
